[project]
name = "filinglens"
version = "0.1.0"
description = "AI analyst for SEC filings: exact XBRL numbers plus cited management commentary."
requires-python = ">=3.12"
# Dependencies are added step by step as each component needs them (uv add <pkg>).
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.13",
    "langchain-openai>=1.7.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]  # personal scratch notebooks are not linted or formatted

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
